# InsightPilot benchmark - SaaS dataset (UNSEEN DATA)
#
# The demo suite (questions.yml) measures the agent on data it was built
# against. This one measures it on a dataset with a different schema, a
# different domain, and an INFERRED semantic layer rather than a
# hand-written one. The gap between the two numbers is the honest estimate
# of how it behaves on a stranger's data.
#
# REQUIRED before running:
#     python tools/ingest.py --use saas
# The harness runs against whatever dataset is active. Run this suite with
# the demo active and every case fails for the wrong reason.
#
# check types (same as questions.yml):
#   number  - answer must contain the reference_sql value (2% tolerance)
#   text    - answer must contain the reference_sql value (case-insensitive)
#   any_of  - answer must contain at least ONE of the listed strings
#   facts   - answer must contain EVERY item in `facts`
#
# Tiers:
#   1 (s01-s08)  single-hop lookups
#   2 (s09-s12)  comparative / period-over-period
#   3 (s13-s16)  multi-hop, dependent computations
#   4 (d01-d03)  diagnostic root-cause
#   5 (t01-t05)  TRAPS - every regression found on 2026-09-23. These are
#                the cases most likely to break on a prompt change, and the
#                reason this file exists.

# ---------------------------------------------------------------- tier 1

- id: s01
  question: How many accounts have churned?
  reference_sql: |
    SELECT COUNT(*) AS v FROM accounts WHERE churn_date IS NOT NULL
  check: number

- id: s02
  question: What was total net revenue in calendar 2025?
  reference_sql: |
    SELECT ROUND(SUM(net_amount), 2) AS v FROM invoices
    WHERE YEAR(billing_month) = 2025
  check: number

- id: s03
  question: Which region has the most accounts?
  reference_sql: |
    SELECT region AS v FROM accounts GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1
  check: text

- id: s04
  question: Which plan has the highest churn rate?
  reference_sql: |
    SELECT plan AS v FROM accounts GROUP BY 1
    ORDER BY AVG(CASE WHEN churn_date IS NOT NULL THEN 1.0 ELSE 0 END) DESC
    LIMIT 1
  check: text

- id: s05
  question: What is the average CSAT score across all support tickets?
  reference_sql: |
    SELECT ROUND(AVG(csat_score), 2) AS v FROM support_tickets
  check: number

- id: s06
  question: Which support ticket category has the most tickets?
  reference_sql: |
    SELECT category AS v FROM support_tickets
    GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1
  check: text

- id: s07
  question: How many accounts are on the Enterprise plan?
  reference_sql: |
    SELECT COUNT(*) AS v FROM accounts WHERE plan = 'Enterprise'
  check: number

- id: s08
  question: Which payment method do the most accounts use?
  reference_sql: |
    SELECT payment_method AS v FROM accounts
    GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1
  check: text

# ---------------------------------------------------------------- tier 2

- id: s09
  question: What was total net revenue in Q2 2026?
  reference_sql: |
    SELECT ROUND(SUM(net_amount), 2) AS v FROM invoices
    WHERE DATE_TRUNC('quarter', billing_month) = DATE '2026-04-01'
  check: number

- id: s10
  question: Which region had the largest net revenue decline from Q1 2026 to Q2 2026?
  reference_sql: |
    WITH q AS (
      SELECT a.region AS reg,
             DATE_TRUNC('quarter', i.billing_month) AS qtr,
             SUM(i.net_amount) AS rev
      FROM invoices i JOIN accounts a ON a.account_id = i.account_id
      GROUP BY 1, 2)
    SELECT reg AS v FROM (
      SELECT reg,
        SUM(CASE WHEN qtr = DATE '2026-04-01' THEN rev ELSE 0 END)
        - SUM(CASE WHEN qtr = DATE '2026-01-01' THEN rev ELSE 0 END) AS delta
      FROM q GROUP BY 1) ORDER BY delta ASC LIMIT 1
  check: text

- id: s11
  question: Which support ticket category had the largest fall in CSAT from Q1 2026 to Q2 2026?
  reference_sql: |
    WITH q AS (
      SELECT category AS cat,
             DATE_TRUNC('quarter', created_date) AS qtr,
             AVG(csat_score) AS score
      FROM support_tickets GROUP BY 1, 2)
    SELECT cat AS v FROM (
      SELECT cat,
        MAX(CASE WHEN qtr = DATE '2026-04-01' THEN score END)
        - MAX(CASE WHEN qtr = DATE '2026-01-01' THEN score END) AS delta
      FROM q GROUP BY 1) ORDER BY delta ASC LIMIT 1
  check: text

- id: s12
  question: >
    What percentage of APAC invoices failed to collect payment in Q2 2026?
  reference_sql: |
    SELECT ROUND(AVG(CASE WHEN i.payment_status = 'failed' THEN 1.0 ELSE 0 END) * 100, 1) AS v
    FROM invoices i JOIN accounts a ON a.account_id = i.account_id
    WHERE a.region = 'APAC'
      AND DATE_TRUNC('quarter', i.billing_month) = DATE '2026-04-01'
  check: number

# ---------------------------------------------------------------- tier 3

- id: s13
  question: >
    Among APAC accounts that pay by card, what percentage of their invoices
    failed in Q2 2026?
  reference_sql: |
    SELECT ROUND(AVG(CASE WHEN i.payment_status = 'failed' THEN 1.0 ELSE 0 END) * 100, 1) AS v
    FROM invoices i JOIN accounts a ON a.account_id = i.account_id
    WHERE a.region = 'APAC' AND i.payment_method = 'card'
      AND DATE_TRUNC('quarter', i.billing_month) = DATE '2026-04-01'
  check: number

- id: s14
  question: Which acquisition channel has generated the most net revenue, and how much?
  reference_sql: |
    SELECT ROUND(SUM(i.net_amount), 2) AS v
    FROM invoices i JOIN accounts a ON a.account_id = i.account_id
    WHERE a.acquisition_channel = 'inbound'
  check: number

- id: s15
  question: >
    For accounts that churned, what was their average number of active users
    in the month immediately before they churned?
  reference_sql: |
    WITH c AS (SELECT account_id, DATE_TRUNC('month', churn_date) AS cm
               FROM accounts WHERE churn_date IS NOT NULL)
    SELECT ROUND(AVG(u.active_users), 2) AS v
    FROM usage_monthly u JOIN c ON c.account_id = u.account_id
    WHERE DATE_DIFF('month', DATE_TRUNC('month', u.usage_month), c.cm) = 1
  check: number

- id: s16
  question: >
    How much revenue did APAC fail to collect in Q2 2026 because invoices
    were not paid? Give the amount that would have been billed.
  reference_sql: |
    SELECT ROUND(SUM(i.list_amount), 2) AS v
    FROM invoices i JOIN accounts a ON a.account_id = i.account_id
    WHERE a.region = 'APAC' AND i.payment_status <> 'paid'
      AND DATE_TRUNC('quarter', i.billing_month) = DATE '2026-04-01'
  check: number

# ---------------------------------------------------------------- tier 4
# Correctness is a SET of claims: the right segment AND the right mechanism.

- id: d01
  question: Why did revenue drop in Q2 2026?
  check: facts
  facts:
    - APAC
    - 172.23
    - 181.85
    - fail

- id: d02
  question: What caused the drop in customer satisfaction in Q2 2026?
  check: facts
  facts:
    - integrations
    - resolution

- id: d03
  question: Is there an early warning sign before a customer churns?
  check: facts
  facts:
    - active users
    - 8.08

# ---------------------------------------------------------------- tier 5
# TRAPS. Each one encodes a real failure observed on 2026-09-23. They are
# here so that a future prompt change that reintroduces one fails loudly
# rather than silently.

- id: t01
  question: Why did revenue drop in Q1 2026?
  # FALSE PREMISE: revenue ROSE, 162.43 M -> 181.85 M. A helpful-sounding
  # agent invents a cause for a decline that never happened.
  check: any_of
  any_of: ["rose", "increase", "grew", "did not drop", "did not decline",
           "no decline", "not supported", "contradict"]

- id: t02
  question: Which marketing campaign generated the most revenue?
  # MISSING CONCEPT: there is no campaign column. The nearest is
  # acquisition_channel. Silently substituting it answers a different
  # question with entirely correct SQL.
  check: any_of
  any_of: ["no campaign", "not contain a campaign", "campaign field",
           "campaign identifier", "no such column", "closest", "substitute"]

- id: t03
  question: Which marketing campaign generated the most revenue?
  # UNQUALIFIED WINDOW: the question names no period, so the answer covers
  # all data. Scoping silently to the latest month returns 17.36 M - about
  # 7% of the true figure - and looks entirely plausible.
  reference_sql: |
    SELECT ROUND(SUM(i.net_amount), 2) AS v
    FROM invoices i JOIN accounts a ON a.account_id = i.account_id
    WHERE a.acquisition_channel = 'inbound'
  check: number

- id: t04
  question: How much revenue was lost to failed payments in APAC in Q2 2026?
  # ZERO BY CONSTRUCTION: net_amount is 0 for every failed invoice - that
  # is what "failed" means. Summing it returns 0, which reads as "failures
  # cost nothing" and is the exact opposite of the truth. The real figure
  # is the gross amount forgone.
  reference_sql: |
    SELECT ROUND(SUM(i.list_amount), 2) AS v
    FROM invoices i JOIN accounts a ON a.account_id = i.account_id
    WHERE a.region = 'APAC' AND i.payment_status <> 'paid'
      AND DATE_TRUNC('quarter', i.billing_month) = DATE '2026-04-01'
  check: number

- id: t05
  question: >
    Compare net revenue by region for Q1 2026 versus Q2 2026, and say which
    region moved most.
  # WINDOW BLEED: a breakdown that quietly covers all history instead of the
  # two named quarters returns APAC 181.78 M rather than 42.68 M -> 31.75 M.
  # Every number looks plausible; nothing downstream can tell.
  check: facts
  facts:
    - APAC
    - 42.68
    - 31.75